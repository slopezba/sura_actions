path_manager_lifecycle_node:
  ros__parameters:
    frame_id: world_ned
    default_max_vertical_speed: 0.3
    navigator_timeout: 2.0
    mode_request_timeout: 5.0
    control_loop_rate: 15.0
    defaults:
      holonomic: false
      goal_tolerance: 0.2
      yaw_tolerance: 0.1
      max_forward_speed: 0.2
      max_yaw_rate: 0.3
      timeout: 60.0
    gains:
      x: 0.4
      y: 0.4
      z: 1.0
      yaw: 1.0
