path_manager_lifecycle_node:
  ros__parameters:
    frame_id: world_ned
    hold_after_reaching: false
    defaults:
      holonomic: true
      max_forward_speed: 0.15
      max_vertical_speed: 0.3
      max_yaw_rate: 0.25
      goal_tolerance: 0.1
      yaw_tolerance: 0.2
      timeout: 500.0
    navigator_timeout: 2.0
    mode_request_timeout: 5.0
    control_loop_rate: 15.0
    gains:
      x: 0.4
      y: 0.4
      z: 1.0
      yaw: 1.0
