go_to_pose_lifecycle_action_node:
  ros__parameters:
    frame_id: world_ned
    hold_after_reaching: false
    defaults:
      holonomic: false
      max_forward_speed: 0.3
      max_vertical_speed: 0.3
      max_yaw_rate: 1.0
      position_tolerance: 0.1
      yaw_tolerance: 0.1
      slowdown_distance: 0.5
      timeout: 60.0
    gains:
      x: 0.4
      y: 0.4
      z: 1.0
      yaw: 1.0
